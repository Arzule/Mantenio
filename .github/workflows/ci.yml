name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (API, web, shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Mantenio.Ci.slnf

      - name: Build
        run: dotnet build Mantenio.Ci.slnf --no-restore -c Release

      # Api.Tests start PostgreSQL 18 with Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test --solution Mantenio.Ci.slnf --no-build -c Release

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Whole history; exceptions are in .gitleaks.toml.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact --no-banner

  android:
    name: Build Android app
    # Private condo deployment repos hit "Disk quota exceeded" installing the MAUI workload on hosted runners;
    # the Android build is checked in the public base repo (deployment APKs are built locally).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/Mantenio.Mobile -f net10.0-android -c Release -p:AndroidSdkDirectory=$ANDROID_HOME
